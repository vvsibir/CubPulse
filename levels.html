<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CubPulse — выбор уровня</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%;
    background: #0b0b1a;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(0, 200, 255, 0.14), transparent 60%),
      radial-gradient(1000px 500px at 90% 110%, rgba(255, 224, 102, 0.10), transparent 60%),
      #0b0b1a;
    padding: 40px 16px 60px;
  }
  header {
    text-align: center;
    margin-bottom: 36px;
  }
  h1 {
    font-size: 42px;
    letter-spacing: 1px;
    text-shadow: 0 0 24px rgba(0, 200, 255, 0.45);
  }
  #levels {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
    max-width: 1100px;
    margin: 0 auto;
  }
  .card {
    width: 260px;
    padding: 22px 22px 18px;
    border-radius: 16px;
    border: 2px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(0, 200, 255, 0.7);
    box-shadow: 0 12px 34px rgba(0, 200, 255, 0.3);
  }
  .card .num {
    font-size: 46px;
    font-weight: bold;
    line-height: 1;
    opacity: 0.92;
  }
  .card .name {
    font-size: 22px;
    font-weight: bold;
    margin-top: 6px;
  }
  .card .meta {
    font-size: 14px;
    opacity: 0.85;
    margin-top: 6px;
  }
  .card .play {
    margin-top: 16px;
    padding: 8px 0;
    text-align: center;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.35);
    font-weight: bold;
    font-size: 15px;
  }
  #status {
    text-align: center;
    margin-top: 30px;
    color: rgba(255, 255, 255, 0.65);
    font-size: 16px;
  }
</style>
</head>
<body>

<header>
  <h1>CubPulse</h1>
</header>

<div id="levels"></div>
<div id="status"></div>

<script src="level-1.js"></script>
<script src="level-2.js"></script>
<script src="level-3.js"></script>
<script src="level-4.js"></script>
<script src="level-5.js"></script>
<script src="level-6.js"></script>
<script src="level-7.js"></script>
<script src="level-8.js"></script>
<script src="level-9.js"></script>
<script src="level-10.js"></script>
<script src="level-11.js"></script>
<script src="level-12.js"></script>
<script src="level-13.js"></script>
<script src="level-14.js"></script>
<script src="level-15.js"></script>
<script src="level-16.js"></script>
<script src="level-17.js"></script>
<script src="level-18.js"></script>
<script src="level-19.js"></script>
<script src="level-20.js"></script>
<script>
/* =========================================================
   Экран выбора уровней. Карточки 1..20 строятся из реестра
   window.GM_LEVELS (level-1.js..level-20.js подключены явными
   тегами выше). Авто-пробы level-21 и дальше нет — в консоли
   не будет 404-ошибок для несуществующих файлов.
   ========================================================= */
(function () {
  'use strict';

  const root = window;
  root.GM_LEVELS = root.GM_LEVELS || {};

  // Скорость игрока (CONFIG.SPEED) — только для показа «секунд прохождения»
  const SPEED = 480;

  // Режим из URL (?mode=...): пробрасывается в ссылки уровней, чтобы не сбрасываться
  const MODE = new URLSearchParams(window.location.search).get('mode') || '';

  // Имена полных тем на выбор уровней: строковая ссылка level.theme.
  // Зеркало THEMES из game.js — здесь нужны только имена для карточек.
  const THEME_NAMES = { default: 'Классика' };
  function themeName(L) {
    const t = L.theme;
    if (!t) return '';
    if (typeof t === 'string') return THEME_NAMES[t] || '';
    return t.name || '';
  }

  function buildCard(id, L) {
    const hue1 = (L.bg && L.bg.start !== undefined) ? L.bg.start : 220;
    const hue2 = (L.bg && L.bg.end !== undefined) ? L.bg.end : 280;
    const secs = (L.length / SPEED).toFixed(1);
    const tn = themeName(L);

    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'gm-1.html?level=' + id + (MODE ? '&mode=' + encodeURIComponent(MODE) : '');
    a.style.background =
      'linear-gradient(135deg, hsl(' + hue1 + ', 60%, 16%), hsl(' + hue2 + ', 70%, 26%))';
    a.innerHTML =
      '<div class="num">' + id + '</div>' +
      '<div class="name">' + (L.name || ('Level ' + id)) + '</div>' +
      '<div class="meta">время: ~' + secs + ' сек</div>' +
      '<div class="meta">объектов: ' + (L.objects ? L.objects.length : '?') + '</div>' +
      (tn ? '<div class="meta">тема: ' + tn + '</div>' : '') +
      '<div class="play">Играть →</div>';
    return a;
  }

  function render() {
    const wrap = document.getElementById('levels');
    const status = document.getElementById('status');
    const frag = document.createDocumentFragment();
    let built = 0;
    for (let id = 1; id <= 20; id++) {
      const L = root.GM_LEVELS[id];
      if (!L) continue; // файл level-N.js отсутствует — карточку пропускаем
      frag.appendChild(buildCard(id, L));
      built++;
    }
    if (built === 0) {
      status.textContent = 'Уровни не найдены';
      return;
    }
    wrap.appendChild(frag);
  }

  render();
})();
</script>
</body>
</html>
