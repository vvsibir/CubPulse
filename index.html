<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title data-i18n-title="page.title.select">CubPulse — выбор уровня</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0b1a;
    overflow: hidden; /* без системной прокрутки: всё умещается в экран */
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex;
    flex-direction: column;
    background:
      radial-gradient(1200px 600px at 20% -10%, rgba(0, 200, 255, 0.14), transparent 60%),
      radial-gradient(1000px 500px at 90% 110%, rgba(255, 224, 102, 0.10), transparent 60%),
      #0b0b1a;
  }
  header {
    flex: 0 0 auto;
    text-align: center;
    /* на низких экранах шапка съедает меньше места (650x450 и т.п.) */
    padding-top: clamp(8px, 4vh, 60px);
    margin-bottom: clamp(2px, 1vh, 10px);
  }
  h1 {
    font-size: clamp(28px, 10vw, 124px);
    font-weight: 800;
    letter-spacing: 2px;
    line-height: 0.9;
    color: #fff;
    text-shadow:
      0 0 6px  rgba(0, 220, 255, 0.95),
      0 0 18px rgba(0, 220, 255, 0.85),
      0 0 44px rgba(0, 200, 255, 0.65),
      0 0 88px rgba(0, 200, 255, 0.45);
    animation: neonPulse 2.6s ease-in-out infinite;
  }
  @keyframes neonPulse {
    0%, 100% {
      text-shadow:
        0 0 6px  rgba(0, 220, 255, 0.95),
        0 0 18px rgba(0, 220, 255, 0.85),
        0 0 44px rgba(0, 200, 255, 0.65),
        0 0 88px rgba(0, 200, 255, 0.45);
    }
    50% {
      text-shadow:
        0 0 8px  rgba(0, 220, 255, 1),
        0 0 26px rgba(0, 220, 255, 0.98),
        0 0 64px rgba(0, 200, 255, 0.85),
        0 0 120px rgba(0, 200, 255, 0.6);
    }
  }
  /* Зона сетки: занимает всё место между шапкой и пагинатором, центрирует карточки */
  #stage {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #levels {
    display: grid;
    grid-template-columns: repeat(4, clamp(140px, 26vw, 260px));
    gap: clamp(8px, 2vw, 24px);
    justify-content: center;
    align-content: center;
    transform-origin: center;
    /* приподнят к центру под крупной шапкой; resize() учитывает при расчёте scale */
    margin-top: clamp(-80px, -4vh, -20px);
  }
  .card {
    width: clamp(140px, 26vw, 260px);
    padding: clamp(10px, 2.4vw, 22px) clamp(10px, 2.4vw, 22px) clamp(8px, 2vw, 18px);
    border-radius: clamp(10px, 2vw, 16px);
    border: 2px solid rgba(255, 255, 255, 0.22);
    color: #fff;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
  }
  .card:hover {
    transform: translateY(-5px);
    border-color: rgba(0, 200, 255, 0.7);
    box-shadow: 0 12px 34px rgba(0, 200, 255, 0.3);
  }
  .card .num {
    font-size: clamp(24px, 6vw, 46px);
    font-weight: bold;
    line-height: 1;
    opacity: 0.92;
  }
  .card .name {
    font-size: clamp(13px, 3vw, 22px);
    font-weight: bold;
    margin-top: clamp(3px, 0.8vw, 6px);
    line-height: 1.12;
  }
  .card .meta {
    font-size: clamp(10px, 2vw, 14px);
    opacity: 0.85;
    margin-top: clamp(2px, 0.7vw, 6px);
    line-height: 1.18;
  }
  .card .play {
    margin-top: clamp(8px, 2vw, 16px);
    padding: clamp(4px, 1.4vw, 8px) 0;
    text-align: center;
    border-radius: clamp(6px, 1.8vw, 10px);
    background: rgba(0, 0, 0, 0.25);
    border: 1px solid rgba(255, 255, 255, 0.35);
    font-weight: bold;
    font-size: clamp(11px, 2.4vw, 15px);
  }
  #status {
    text-align: center;
    margin-top: clamp(6px, 2vw, 30px);
    color: rgba(255, 255, 255, 0.65);
    font-size: clamp(10px, 2.4vw, 16px);
  }
  /* Пагинация: страницы карточек (вместо системной прокрутки — требование 1.10.2).
      Прижата к низу страницы: footer-зона flex-колонки, не уезжает за край.
      Кнопки НЕ переносятся: одна строка + горизонтальный скролл при нехватке ширины.
      margin: 0 auto (в flex-колонке по косой оси) — сжимает блок под контент и центрирует. */
  #pager {
    flex: 0 0 auto;
    display: flex;
    flex-wrap: nowrap;
    justify-content: flex-start;
    align-items: center;
    gap: clamp(4px, 1vw, 10px);
    padding: clamp(6px, 1.6vw, 10px) clamp(4px, 1.6vw, 16px) clamp(10px, 2.4vw, 22px);
    margin: 0 auto;
    max-width: 100%;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: thin;
  }
  #pager::-webkit-scrollbar { height: 4px; }
  .page-btn {
    flex: 0 0 auto;
    min-width: clamp(30px, 9vw, 46px);
    padding: clamp(6px, 2vw, 10px) clamp(5px, 1.6vw, 8px);
    font-family: inherit;
    font-size: clamp(11px, 3vw, 18px);
    font-weight: bold;
    color: #fff;
    background: rgba(0, 0, 0, 0.4);
    border: 2px solid rgba(255, 255, 255, 0.22);
    border-radius: clamp(6px, 2vw, 10px);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .page-btn:hover:not(:disabled):not(.page-btn--active) {
    background: rgba(0, 200, 255, 0.22);
    border-color: rgba(0, 200, 255, 0.7);
    box-shadow: 0 0 18px rgba(0, 200, 255, 0.45);
  }
  .page-btn--active {
    background: rgba(0, 200, 255, 0.22);
    border-color: rgba(0, 200, 255, 0.85);
    box-shadow: 0 0 14px rgba(0, 200, 255, 0.4);
  }
  .page-btn:disabled { opacity: 0.35; cursor: default; }

  /* Узкие экраны (портретные телефоны): 2 карточки в ряд, отрицательный margin убран —
     он и был причиной наезда сетки на шапку/пагинацию на маленьких вьюпортах. */
  @media (max-width: 559px) {
    #levels {
      grid-template-columns: repeat(2, clamp(120px, 46vw, 200px));
      gap: clamp(8px, 3vw, 16px);
      margin-top: 0;
    }
    .card {
      width: clamp(120px, 46vw, 200px);
      padding: clamp(8px, 3vw, 16px) clamp(8px, 3vw, 16px) clamp(6px, 2.4vw, 12px);
    }
    .card .num { font-size: clamp(24px, 9vw, 38px); }
    .card .name { font-size: clamp(13px, 5vw, 18px); }
    .card .meta { font-size: clamp(10px, 3.6vw, 13px); }
    .card .play { font-size: clamp(11px, 4vw, 14px); }
  }
</style>
</head>
<body>

<header>
  <h1>CubPulse</h1>
</header>

<div id="stage">
  <div id="levels"></div>
</div>
<div id="pager"></div>
<div id="status"></div>

<script id="levels-app">
/* =========================================================
   Экран выбора уровней. Карточки 1..40 строятся из реестра
   window.GM_LEVELS (level-1.js..level-40.js подключены явными
   тегами выше). Авто-пробы level-41 и дальше нет — в консоли
   не будет 404-ошибок для несуществующих файлов.
   Пагинация: по getPerPage() карточек на страницу (страницы в #pager).
   ========================================================= */
(function () {
  'use strict';

  const root = window;
  root.GM_LEVELS = root.GM_LEVELS || {};

  // Скорость игрока (CONFIG.SPEED) — только для показа «секунд прохождения»
  const SPEED = 480;

  // Карточек на страницу: 4 (4 в ряд × 1 ряд) или 2 на узких экранах
  // (2 в ряд × 1 ряд; 40 уровней → 10 или 20 страниц).
  // Сетка масштабируется под экран (resize), пагинация прижата к низу.
  // Собственная пагинация вместо системной прокрутки (требование 1.10.2)
  // Порог согласован с @media (max-width: 559px) в CSS.
  const NARROW_MAX = 559;
  function getPerPage() { return window.innerWidth <= NARROW_MAX ? 2 : 4; }

  // Режим из URL (?mode=...): пробрасывается в ссылки уровней, чтобы не сбрасываться
  const MODE = new URLSearchParams(window.location.search).get('mode') || '';

  // Текущая страница (0-based); переживает пересборку при смене языка
  let page = 0;

  // Имена полных тем на выбор уровней: строковая ссылка level.theme.
  // Зеркало THEMES из game.js — здесь нужны только имена для карточек.
  const THEME_NAMES = { default: 'Классика' };
  function themeName(L) {
    const t = L.theme;
    if (!t) return '';
    // Имя темы: строка-ссылка на реестр ('default') или inline theme.name
    const raw = (typeof t === 'string' ? THEME_NAMES[t] || '' : t.name || '');
    return window.GM_I18N ? window.GM_I18N.themeName(raw) : raw;
  }

  function levelIds() {
    const ids = [];
    for (let id = 1; id <= 40; id++) if (root.GM_LEVELS[id]) ids.push(id);
    return ids;
  }
  function pageCount(n) { return Math.max(1, Math.ceil(n / getPerPage())); }

  function buildCard(id, L) {
    const hue1 = (L.bg && L.bg.start !== undefined) ? L.bg.start : 220;
    const hue2 = (L.bg && L.bg.end !== undefined) ? L.bg.end : 280;
    const secs = Math.round(L.length / SPEED); // целые секунды, без десятых долей
    const tn = themeName(L);

    const a = document.createElement('a');
    a.className = 'card';
    a.href = 'gm-1.html?level=' + id + (MODE ? '&mode=' + encodeURIComponent(MODE) : '');
    a.style.background =
      'linear-gradient(135deg, hsl(' + hue1 + ', 60%, 16%), hsl(' + hue2 + ', 70%, 26%))';
    a.innerHTML =
      '<div class="num">' + id + '</div>' +
      '<div class="name">' + (window.GM_I18N ? window.GM_I18N.levelName(L.name || ('Level ' + id)) : (L.name || ('Level ' + id))) + '</div>' +
      '<div class="meta">' + (window.GM_I18N ? window.GM_I18N.t('card.time', { s: secs }) : 'время: ~' + secs + ' сек') + '</div>' +
      '<div class="meta">' + (window.GM_I18N ? window.GM_I18N.t('card.objects', { n: L.objects ? L.objects.length : '?' }) : 'объектов: ' + (L.objects ? L.objects.length : '?')) + '</div>' +
      (tn ? '<div class="meta">' + (window.GM_I18N ? window.GM_I18N.t('card.theme', { name: tn }) : 'тема: ' + tn) + '</div>' : '') +
      '<div class="play">' + (window.GM_I18N ? window.GM_I18N.t('card.play') : 'Играть →') + '</div>';
    return a;
  }

  function renderPager(pager, cur, total) {
    const btn = (label, active, disabled, on) => {
      const b = document.createElement('button');
      b.className = 'page-btn' + (active ? ' page-btn--active' : '');
      b.innerHTML = label;
      b.disabled = disabled;
      if (on) b.addEventListener('click', on);
      return b;
    };
    pager.textContent = '';
    pager.appendChild(btn('‹', false, cur === 0, () => { page = cur - 1; render(); }));
    for (let i = 0; i < total; i++) {
      pager.appendChild(btn(String(i + 1), i === cur, i === cur, () => { page = i; render(); }));
    }
    pager.appendChild(btn('›', false, cur === total - 1, () => { page = cur + 1; render(); }));
  }

  function render() {
    const wrap = document.getElementById('levels');
    const status = document.getElementById('status');
    const pager = document.getElementById('pager');
    const ids = levelIds();

    if (ids.length === 0) {
      status.textContent = window.GM_I18N ? window.GM_I18N.t('card.notFound') : 'Уровни не найдены';
      return;
    }

    const total = pageCount(ids.length);
    if (page >= total) page = total - 1;

    const per = getPerPage();
    wrap.textContent = '';
    const from = page * per;
    const to = Math.min(from + per, ids.length);
    for (let i = from; i < to; i++) {
      wrap.appendChild(buildCard(ids[i], root.GM_LEVELS[ids[i]]));
    }

    renderPager(pager, page, total);
    resize(); // размеры карточек изменились (смена языка/страницы) — пересчитать scale
  }

  // Масштабирование сетки под свободную зону #stage: карточки не уползают
  // в шапку и пагинацию. Трансформ не влияет на раскладку, поэтому берём
  // реальный бокс #stage (flex-остаток между шапкой и пагинатором), а не
  // высоту окна. Отрицательный margin-top сетки (подъём к центру) учитывается:
  // сетка центрируется по margin-box, поэтому её визуальный габарит по высоте
  // = H - marginTop (marginTop < 0 → больше H).
  function resize() {
    const stage = document.getElementById('stage');
    const lv = document.getElementById('levels');
    if (!stage || !lv) return;
    const W = lv.offsetWidth;
    const H = lv.offsetHeight;
    if (!W || !H) return;
    const sw = stage.clientWidth - 16;  // небольшой запас по ширине
    const sh = stage.clientHeight;
    if (!(sw > 0) || !(sh > 0)) return; // бокс ещё не измерен (мок/до раскладки)
    const mt = parseFloat(window.getComputedStyle(lv).marginTop) || 0;
    const needH = Math.max(1, H - mt);
    const scale = Math.min(1, sw / W, sh / needH);
    stage.style.transform = scale === 1 ? '' : 'scale(' + scale + ')';
  }

  // При переходе через порог ширины меняется число карточек на страницу —
  // сетку и пагинацию надо пересобрать, а не только масштабировать.
  let lastPerPage = getPerPage();
  function onViewportChange() {
    const per = getPerPage();
    if (per !== lastPerPage) { lastPerPage = per; render(); }
    resize();
  }

  window.GM_SELECT_RENDER = render; // пересборка карточек после смены языка (SDK)

  if (window.addEventListener) {
    window.addEventListener('resize', onViewportChange);
    window.addEventListener('orientationchange', onViewportChange);
  }

  render();
  resize();
})();
</script>
<script>
/* Yandex Games SDK — как в gm-1.html: index.html теперь стартовая страница
   архива, поэтому SDK (и автоопределение языка) инициализируем здесь же. */
(function () {
  function isYandexEmbed() {
    try {
      if (window.self === window.top) return false;
      var host = (document.referrer || '').split('/')[2] || '';
      if (host) host = host.split(':')[0];
      if (!host) host = window.parent.location.hostname;
      return /(^|\.)yandex\.(ru|net|kz|by|uz|az|com|com\.tr|com\.ge|com\.am)$/i.test(host);
    } catch (e) {
      return window.self !== window.top;
    }
  }
  function initSDK() {
    try {
      if (typeof YaGames === 'undefined' || window.ysdk) return;
      YaGames.init().then(function (ysdk) {
        window.ysdk = ysdk;
        // 2.14: автоопределение языка платформы при старте
        var lang = ysdk.environment && ysdk.environment.i18n && ysdk.environment.i18n.lang;
        if (lang) {
          window.GM_I18N_LANG = lang;
          if (window.GM_I18N) {
            window.GM_I18N.setLang(lang);
            if (window.GM_SELECT_RENDER) window.GM_SELECT_RENDER();
          }
        }
        if (ysdk.features && ysdk.features.LoadingAPI && ysdk.features.LoadingAPI.ready) {
          ysdk.features.LoadingAPI.ready();
        }
      }).catch(function () {});
    } catch (e) {}
  }
  if (!isYandexEmbed()) return;
  if (typeof YaGames !== 'undefined') { initSDK(); return; }
  var s = document.createElement('script');
  s.src = 'https://yandex.ru/games/sdk/v2';
  s.async = true;
  s.addEventListener('load', initSDK, false);
  s.addEventListener('error', function () {}, false);
  document.head.appendChild(s);
})();
</script>
