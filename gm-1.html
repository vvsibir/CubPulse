<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Geometry Dash — Level 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0b1a;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none; /* iOS: без лупы/выделения при длинном таче */
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    background: #111;
    box-shadow: 0 0 60px rgba(0, 200, 255, 0.25);
    cursor: pointer;
    touch-action: none; /* убираем жесты браузера на таче — управляем сами */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none; /* без контекстного меню/выделения при длинном таче */
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>

<script>
/* =========================================================
   КОНФИГ
   ========================================================= */
const CONFIG = {
  W: 1280,
  H: 720,

  GROUND_Y: 640,
  PLAYER_SIZE: 40,

  SPEED: 480,
  GRAVITY: 2800,
  JUMP_VELOCITY: -900,
  MAX_FALL: 1600,

  CAMERA_X_RATIO: 0.30,

  // время прыжка ≈ 2 * |JUMP_VELOCITY| / GRAVITY = 2 * 900 / 2800 ≈ 0.643 сек
  // хотим 1 оборот = 2π ≈ 6.28 рад за это время
  // ROTATION_SPEED = 6.28 / 0.643 ≈ 9.77  
  ROTATION_SPEED: 9.77,

  PARTICLE_LIFE: 0.6,
};

/* =========================================================
   УРОВЕНЬ
   ========================================================= */
const LEVEL = {
  length: 9800,
  groundY: CONFIG.GROUND_Y,
  objects: [
    // --- Разминка ---
    { type: 'spike',    x: 700,  y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },
    { type: 'spike',    x: 1000, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },
    { type: 'spike',    x: 1300, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },

    // --- Двойной шип ---
    { type: 'spike',    x: 1600, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },
    { type: 'spike',    x: 1640, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },

    // --- Блок-ступенька ---
    { type: 'block',    x: 2000, y: CONFIG.GROUND_Y - 80, w: 80, h: 80 },
    { type: 'spike',    x: 2250, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },

    // --- Парящая платформа ---
    { type: 'platform', x: 2500, y: CONFIG.GROUND_Y - 140, w: 180, h: 20 },
    { type: 'spike',    x: 2900, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },
    { type: 'spike',    x: 2940, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },

    // --- Тройной шип с блоком-помощником ---
    { type: 'block',    x: 3300, y: CONFIG.GROUND_Y - 80, w: 80, h: 80 },
    { type: 'spike',    x: 3500, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },
    { type: 'spike',    x: 3540, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },
    { type: 'spike',    x: 3580, y: CONFIG.GROUND_Y - 40, w: 40, h: 40 },

    // --- Лестница из блоков (настоящие ступени с зазорами) ---
    { type: 'block',    x: 4000, y: CONFIG.GROUND_Y - 80,  w: 80, h: 80  },
    { type: 'block',    x: 4180, y: CONFIG.GROUND_Y - 160, w: 80, h: 160 },
    { type: 'block',    x: 4360, y: CONFIG.GROUND_Y - 240, w: 80, h: 240 },
    { type: 'block',    x: 4540, y: CONFIG.GROUND_Y - 160, w: 80, h: 160 },
    { type: 'block',    x: 4720, y: CONFIG.GROUND_Y - 80,  w: 80, h: 80  },

    // --- Прыжки по парящим платформам ---
    { type: 'platform', x: 5100, y: CONFIG.GROUND_Y - 180, w: 140, h: 20 },
    { type: 'platform', x: 5400, y: CONFIG.GROUND_Y - 260, w: 140, h: 20 },
    { type: 'platform', x: 5700, y: CONFIG.GROUND_Y - 180, w: 140, h: 20 },
    { type: 'spike',    x: 5950, y: CONFIG.GROUND_Y - 40,  w: 40, h: 40 },

    // --- Коридор с перевёрнутыми шипами ---
    { type: 'spike',    x: 6300, y: CONFIG.GROUND_Y - 40,  w: 40, h: 40 },
    { type: 'block',    x: 6500, y: CONFIG.GROUND_Y - 200, w: 200, h: 40 },
    { type: 'spike',    x: 6550, y: CONFIG.GROUND_Y - 240, w: 40, h: 40, flip: true },
    { type: 'spike',    x: 6600, y: CONFIG.GROUND_Y - 240, w: 40, h: 40, flip: true },

    // --- Финальный рывок ---
    { type: 'spike',    x: 7000, y: CONFIG.GROUND_Y - 40,  w: 40, h: 40 },
    { type: 'spike',    x: 7040, y: CONFIG.GROUND_Y - 40,  w: 40, h: 40 },
    { type: 'platform', x: 7300, y: CONFIG.GROUND_Y - 150, w: 200, h: 20 },
    { type: 'spike',    x: 7650, y: CONFIG.GROUND_Y - 40,  w: 40, h: 40 },
    { type: 'block',    x: 7900, y: CONFIG.GROUND_Y - 80,  w: 80, h: 80  },
    { type: 'block',    x: 8080, y: CONFIG.GROUND_Y - 160, w: 80, h: 160 },
    { type: 'spike',    x: 8300, y: CONFIG.GROUND_Y - 40,  w: 40, h: 40 },

    // --- Финиш ---
    { type: 'finish',   x: 9400, y: CONFIG.GROUND_Y - 260, w: 60, h: 260 },
  ]
};

/* =========================================================
   ИГРОК
   ========================================================= */
class Player {
  constructor() {
    this.reset();
  }

  reset() {
    this.x = 0;
    this.y = CONFIG.GROUND_Y - CONFIG.PLAYER_SIZE;
    this.w = CONFIG.PLAYER_SIZE;
    this.h = CONFIG.PLAYER_SIZE;
    this.vy = 0;
    this.onGround = true;
    this.rotation = 0;
    this.alive = true;
    this.won = false;
    this.jumpBuffer = 0; // буфер нажатия для отзывчивого управления
  }

  jump() {
    if (!this.alive || this.won) return;
    if (this.onGround) {
      this.vy = CONFIG.JUMP_VELOCITY;
      this.onGround = false;
      this.jumpBuffer = 0;
      return true;
    }
    // Запоминаем нажатие — сработает при приземлении
    this.jumpBuffer = 0.12;
    return false;
  }

  // Обновление только физики.
  // onGround здесь — состояние на начало кадра (с прошлого кадра).
  update(dt) {
    if (!this.alive || this.won) return;

    this.x += CONFIG.SPEED * dt;

    this.vy += CONFIG.GRAVITY * dt;
    if (this.vy > CONFIG.MAX_FALL) this.vy = CONFIG.MAX_FALL;
    this.y += this.vy * dt;

    // Вращение — по ТЕКУЩЕМУ onGround (состояние на начало кадра)
    if (!this.onGround) {
      this.rotation += CONFIG.ROTATION_SPEED * dt;
    } else {
      const quarter = Math.PI / 2;
      const target = Math.round(this.rotation / quarter) * quarter;
      const diff = target - this.rotation;
      if (Math.abs(diff) < 0.01) {
        this.rotation = target;
      } else {
        this.rotation += diff * Math.min(1, dt * 20);
      }
    }

    if (this.jumpBuffer > 0) this.jumpBuffer -= dt;
  }
}

/* =========================================================
   ЧАСТИЦЫ
   ========================================================= */
class Particle {
  constructor(x, y, vx, vy, color, size, life) {
    this.x = x; this.y = y;
    this.vx = vx; this.vy = vy;
    this.color = color;
    this.size = size;
    this.life = life;
    this.maxLife = life;
  }
  update(dt) {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.vy += 800 * dt;
    this.life -= dt;
  }
  draw(ctx) {
    const a = Math.max(0, this.life / this.maxLife);
    ctx.globalAlpha = a;
    ctx.fillStyle = this.color;
    ctx.fillRect(this.x, this.y, this.size, this.size);
    ctx.globalAlpha = 1;
  }
}

/* =========================================================
   КАМЕРА
   ========================================================= */
class Camera {
  constructor() {
    this.x = 0;
    this.y = 0;
  }
  update(player) {
    const targetX = player.x - CONFIG.W * CONFIG.CAMERA_X_RATIO;
    this.x += (targetX - this.x) * 0.15;

    const playerCenterY = player.y + player.h / 2;
    let targetY = 0;
    if (playerCenterY < CONFIG.H * 0.45) {
      targetY = playerCenterY - CONFIG.H * 0.45;
    }
    this.y += (targetY - this.y) * 0.08;
  }
  apply(ctx) {
    ctx.translate(-this.x, -this.y);
  }
}

/* =========================================================
   ЗВУК И МУЗЫКА (Web Audio API — всё процедурное, без файлов)
   ========================================================= */
const BPM = 138;
const STEP_DUR = 60 / BPM / 4;  // длительность 16-й ноты (сек)
const TOTAL_STEPS = 64;          // 4 такта по 16 шагов
const midi = (m) => 440 * Math.pow(2, (m - 69) / 12);

// Прогрессия A-минор: Am – F – C – G (один такт на аккорд)
const CHORDS = [
  { // Am
    bass: midi(45),                              // A2
    arp:  [midi(57), midi(60), midi(64), midi(69)], // A3 C4 E4 A4
    pad:  [midi(57), midi(64), midi(69)],
    mel:  [[0, midi(69)], [4, midi(72)], [8, midi(76)], [12, midi(69)]],
  },
  { // F
    bass: midi(41),                              // F2
    arp:  [midi(57), midi(60), midi(65), midi(69)], // A3 C4 F4 A4
    pad:  [midi(57), midi(65), midi(69)],
    mel:  [[0, midi(69)], [4, midi(72)], [8, midi(77)], [12, midi(72)]],
  },
  { // C
    bass: midi(48),                              // C3
    arp:  [midi(60), midi(64), midi(67), midi(72)], // C4 E4 G4 C5
    pad:  [midi(60), midi(64), midi(67)],
    mel:  [[0, midi(67)], [4, midi(72)], [8, midi(76)], [12, midi(79)]],
  },
  { // G
    bass: midi(43),                              // G2
    arp:  [midi(59), midi(62), midi(67), midi(71)], // B3 D4 G4 B4
    pad:  [midi(59), midi(62), midi(67)],
    mel:  [[0, midi(67)], [4, midi(71)], [8, midi(74)], [12, midi(71)]],
  },
];

class Sound {
  constructor() {
    this.ctx = null;
    this.musicGain = null;
    this.sfxGain = null;
    this.muted = false;
    this.musicOn = false;
    this._timer = null;
    this._step = 0;
    this._nextTime = 0;
    this._noiseBuf = null;
    try { this.muted = localStorage.getItem('gm_muted') === '1'; } catch (e) {}
  }

  // Создать контекст при первом взаимодействии (autoplay policy)
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.musicGain = this.ctx.createGain();
      this.musicGain.connect(this.ctx.destination);
      this.sfxGain = this.ctx.createGain();
      this.sfxGain.connect(this.ctx.destination);
      this._noiseBuf = this._makeNoise();
      this._applyMute();
    }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }

  _applyMute() {
    if (!this.ctx) return;
    this.musicGain.gain.value = this.muted ? 0 : 0.45;
    this.sfxGain.gain.value = this.muted ? 0 : 0.9;
  }

  toggleMute() {
    this.muted = !this.muted;
    this._applyMute();
    try { localStorage.setItem('gm_muted', this.muted ? '1' : '0'); } catch (e) {}
    return this.muted;
  }

  _makeNoise() {
    const len = Math.floor(this.ctx.sampleRate * 1);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  /* ---------- SFX ---------- */

  // Простой тон с огибающей
  _tone({ type = 'square', f0, f1, dur, vol = 0.3, delay = 0 }) {
    const t = this.ctx.currentTime + delay;
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(f0, t);
    if (f1 !== undefined) osc.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    g.connect(this.sfxGain);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  // Шумовой импульс через фильтр
  _noise({ dur, vol, delay = 0, fStart, fEnd, type = 'lowpass', q = 1 }) {
    const t = this.ctx.currentTime + delay;
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    const f = this.ctx.createBiquadFilter();
    f.type = type;
    f.frequency.setValueAtTime(fStart, t);
    f.frequency.exponentialRampToValueAtTime(Math.max(20, fEnd), t + dur);
    f.Q.value = q;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f);
    f.connect(g);
    g.connect(this.sfxGain);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  jump() {
    if (!this.ctx) return;
    this._tone({ type: 'triangle', f0: 520, f1: 950, dur: 0.09, vol: 0.22 });
    this._noise({ dur: 0.05, vol: 0.07, fStart: 3000, fEnd: 1500, type: 'highpass' });
  }

  land() {
    if (!this.ctx) return;
    this._noise({ dur: 0.08, vol: 0.1, fStart: 500, fEnd: 150, type: 'lowpass' });
    this._tone({ type: 'sine', f0: 160, f1: 70, dur: 0.09, vol: 0.12 });
  }

  death() {
    if (!this.ctx) return;
    this._noise({ dur: 0.5, vol: 0.8, fStart: 3000, fEnd: 100, type: 'lowpass', q: 0.6 });
    this._tone({ type: 'sawtooth', f0: 200, f1: 35, dur: 0.45, vol: 0.5 });
    this._tone({ type: 'square', f0: 100, f1: 28, dur: 0.45, vol: 0.28, delay: 0.02 });
    // Суб-бамп для тяжелого удара
    this._tone({ type: 'sine', f0: 90, f1: 30, dur: 0.35, vol: 0.6, delay: 0.01 });
  }

  win() {
    if (!this.ctx) return;
    const notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      this._tone({ type: 'square', f0: f, f1: f, dur: 0.32, vol: 0.18, delay: i * 0.09 });
    });
    this._noise({ dur: 0.6, vol: 0.1, fStart: 8000, fEnd: 4000, type: 'highpass', delay: 0.12 });
  }

  /* ---------- МУЗЫКА ---------- */

  _musicNote({ type, f, dur, vol, t, filter }) {
    const osc = this.ctx.createOscillator();
    osc.type = type;
    osc.frequency.value = f;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(g);
    if (filter) {
      const flt = this.ctx.createBiquadFilter();
      flt.type = filter.type;
      flt.frequency.value = filter.freq;
      g.connect(flt);
      flt.connect(this.musicGain);
    } else {
      g.connect(this.musicGain);
    }
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  _kick(t) {
    const osc = this.ctx.createOscillator();
    const g = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(42, t + 0.11);
    g.gain.setValueAtTime(0.55, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.13);
    osc.connect(g);
    g.connect(this.musicGain);
    osc.start(t);
    osc.stop(t + 0.15);
  }

  _snare(t) {
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = 2000;
    bp.Q.value = 0.8;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.26, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
    src.connect(bp);
    bp.connect(g);
    g.connect(this.musicGain);
    src.start(t);
    src.stop(t + 0.16);
    this._musicNote({ type: 'triangle', f: 200, dur: 0.08, vol: 0.18, t });
  }

  _hat(t, vol, open) {
    const src = this.ctx.createBufferSource();
    src.buffer = this._noiseBuf;
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass';
    hp.frequency.value = 7500;
    const g = this.ctx.createGain();
    const dur = open ? 0.18 : 0.05;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    src.connect(hp);
    hp.connect(g);
    g.connect(this.musicGain);
    src.start(t);
    src.stop(t + dur + 0.02);
  }

  _bass(t, f) {
    this._musicNote({ type: 'square', f, dur: 0.22, vol: 0.28, t, filter: { type: 'lowpass', freq: 600 } });
  }

  _arp(t, f) {
    this._musicNote({ type: 'triangle', f, dur: STEP_DUR * 0.9, vol: 0.085, t });
  }

  _mel(t, f) {
    const dur = STEP_DUR * 3;
    const osc = this.ctx.createOscillator();
    osc.type = 'square';
    osc.frequency.value = f;
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = 2500;
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.13, t + 0.006);
    g.gain.setValueAtTime(0.13, t + dur - 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(flt);
    flt.connect(g);
    g.connect(this.musicGain);
    osc.start(t);
    osc.stop(t + dur + 0.05);
  }

  _pad(t, freqs, dur) {
    const g = this.ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.4);
    g.gain.setValueAtTime(0.06, t + dur - 0.06);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    const flt = this.ctx.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.value = 1400;
    g.connect(flt);
    flt.connect(this.musicGain);
    for (const f of freqs) {
      for (const det of [-6, 6]) {
        const osc = this.ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = f;
        osc.detune.value = det;
        osc.connect(g);
        osc.start(t);
        osc.stop(t + dur + 0.1);
      }
    }
  }

  _playStep(step, t) {
    const bar = (step / 16) | 0;
    const s = step % 16;
    const chord = CHORDS[bar];

    // Бочка — каждый quarter
    if (s % 4 === 0) this._kick(t);
    // Снейр — на 2-й и 4-й доле
    if (s === 4 || s === 12) this._snare(t);
    // Хэты — каждую 16-ю (акцент на offbeat), открытый на 14-й
    if (s % 2 === 1) this._hat(t, 0.13, false);
    else this._hat(t, 0.08, false);
    if (s === 14) this._hat(t, 0.16, true);
    // Бас — по quarter
    if (s % 4 === 0) this._bass(t, chord.bass);
    // Арпеджио — каждая 16-я
    this._arp(t, chord.arp[s % 4]);
    // Мелодия — по долям
    for (const [ms, mf] of chord.mel) if (s === ms) this._mel(t, mf);
    // Пэд — в начале такта
    if (s === 0) this._pad(t + 0.01, chord.pad, STEP_DUR * 16);
  }

  startMusic() {
    if (!this.ctx) return;
    // Восстанавливаем громкость (после обрыва при смерти)
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(this.muted ? 0 : 0.45, t);
    if (this.musicOn) return;
    this.musicOn = true;
    this._step = 0;
    this._nextTime = this.ctx.currentTime + 0.1;
    if (!this._timer) {
      this._timer = setInterval(() => this._tick(), 25);
    }
  }

  stopMusic() {
    this.musicOn = false;
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
  }

  // Резкий обрыв музыки (смерть): глушим мастер-гейн и останавливаем планировщик
  musicCut() {
    this.stopMusic();
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.musicGain.gain.cancelScheduledValues(t);
    this.musicGain.gain.setValueAtTime(0, t);
    this._step = 0;
  }

  _tick() {
    if (!this.ctx) return;
    let guard = 0;
    while (this._nextTime < this.ctx.currentTime + 0.12 && guard++ < 32) {
      this._playStep(this._step, this._nextTime);
      this._step = (this._step + 1) % TOTAL_STEPS;
      this._nextTime += STEP_DUR;
    }
  }
}

/* =========================================================
   КОЛЛИЗИИ
   ========================================================= */
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x &&
         a.y < b.y + b.h && a.y + a.h > b.y;
}

// Возвращает: 'die' | 'land' | 'win' | null
function checkCollision(player, obj) {
  if (!player.alive || player.won) return null;

  // --- Шипы ---
  if (obj.type === 'spike') {
    // Хитбокс шипа чуть меньше визуального — так честнее
    let hit;
    if (obj.flip) {
      // шип «сверху вниз»
      hit = {
        x: obj.x + obj.w * 0.25,
        y: obj.y,
        w: obj.w * 0.5,
        h: obj.h * 0.6
      };
    } else {
      // обычный шип остриём вверх
      hit = {
        x: obj.x + obj.w * 0.25,
        y: obj.y + obj.h * 0.4,
        w: obj.w * 0.5,
        h: obj.h * 0.6
      };
    }
    if (aabb(player, hit)) return 'die';
  }

  // --- Блоки и платформы ---
  if (obj.type === 'block' || obj.type === 'platform') {
    if (aabb(player, obj)) {
      // Насколько игрок «вошёл» в объект сверху
      const playerBottom = player.y + player.h;
      const overlapTop = playerBottom - obj.y;

      // Условие приземления сверху:
      //  - падаем вниз (vy >= 0)
      //  - вошли неглубоко (не больше 70% высоты игрока)
      //  - нижняя грань игрока выше середины объекта
      const canLand = player.vy >= 0
                   && overlapTop <= player.h * 0.7
                   && playerBottom <= obj.y + obj.h * 0.5;

      if (canLand) {
        player.y = obj.y - player.h;
        player.vy = 0;
        player.onGround = true;
        return 'land';
      }

      // Иначе — удар сбоку или снизу
      return 'die';
    }
  }

  // --- Финиш ---
  if (obj.type === 'finish') {
    if (aabb(player, obj)) return 'win';
  }

  return null;
}

/* =========================================================
   ИГРА
   ========================================================= */
class Game {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext('2d');
    this.player = new Player();
    this.camera = new Camera();
    this.particles = [];
    this.attempts = 1;
    this.state = 'playing'; // playing | dead | won
    this.deathTimer = 0;
    this.jumpHeld = false;
    this.time = 0;
    this.bgOffset = 0;
    this.startTime = 0;
    this.totalTime = 0;

    this.resize();
    window.addEventListener('resize', () => this.resize());
    this.sound = new Sound();

    // Управление клавиатурой
    window.addEventListener('keydown', (e) => {
      this.sound.unlock();
      if (e.code === 'Space') {
        e.preventDefault();
        if (!this.jumpHeld) this.onPressStart();
        this.jumpHeld = true;
      }
      if (e.code === 'KeyR') this.restart();
      if (e.code === 'KeyM') this.sound.toggleMute();
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') this.jumpHeld = false;
    });

    // Управление указателем (Pointer Events — мышь и тач без двойного срабатывания:
    // в отличие от touchstart+mousedown, pointerdown при таче не дублируется)
    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      this.sound.unlock();
      if (!e.isPrimary) return; // игнорируем второй палец
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      if (this._hitVolume(e)) { this.sound.toggleMute(); return; }
      this.onPressStart();
      this.jumpHeld = true;
    });
    canvas.addEventListener('pointerup', (e) => {
      if (e.isPrimary) this.jumpHeld = false;
    });
    canvas.addEventListener('pointercancel', () => { this.jumpHeld = false; });
    canvas.addEventListener('pointerleave', () => { this.jumpHeld = false; });

    // Защита от выделения текста при длинном таче
    document.addEventListener('selectstart', (e) => e.preventDefault());
    // Запрет контекстного меню (правая кнопка мыши / длинный тач) по всей странице
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    this.lastTime = performance.now();
    requestAnimationFrame((t) => this.loop(t));
  }

  // Обработка начала нажатия
  onPressStart() {
    this.sound.unlock();
    if (this.state === 'playing') {
      this.sound.startMusic(); // старт/продолжение музыки с первого нажатия (no-op, если играет)
      if (this.player.jump()) this.sound.jump();
    } else if (this.state === 'dead' && this.deathTimer > 0.4) {
      this.restart();
    } else if (this.state === 'won') {
      this.restart();
    }
  }

  // Попадание в иконку динамика (в координатах канваса 1280x720)
  _hitVolume(e) {
    const rect = this.canvas.getBoundingClientRect();
    const px = (e.clientX - rect.left) * (CONFIG.W / rect.width);
    const py = (e.clientY - rect.top) * (CONFIG.H / rect.height);
    return px > CONFIG.W - 70 && px < CONFIG.W - 8 && py > 56 && py < 110;
  }

  restart() {
    this.player.reset();
    this.camera.x = -CONFIG.W * CONFIG.CAMERA_X_RATIO;
    this.camera.y = 0;
    this.particles = [];
    this.state = 'playing';
    this.deathTimer = 0;
    this.attempts++;
    this.startTime = this.time;
    this.jumpHeld = false;
    this.sound.startMusic();
  }

  resize() {
    const aspect = CONFIG.W / CONFIG.H;
    const winW = window.innerWidth;
    const winH = window.innerHeight;
    let w = winW, h = winH;
    if (winW / winH > aspect) {
      w = winH * aspect;
    } else {
      h = winW / aspect;
    }
    this.canvas.style.width = w + 'px';
    this.canvas.style.height = h + 'px';
  }

  spawnParticles(x, y, count, color, spread = 200) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * spread;
      this.particles.push(new Particle(
        x, y,
        Math.cos(angle) * speed,
        Math.sin(angle) * speed,
        color,
        3 + Math.random() * 4,
        CONFIG.PARTICLE_LIFE * (0.5 + Math.random() * 0.5)
      ));
    }
  }

  update(dt) {
    this.time += dt;
    this.bgOffset += CONFIG.SPEED * dt;

    if (this.state === 'playing') {
        const wasOnGround = this.player.onGround;

        // 1. Обновляем физику — onGround ещё хранит состояние ПРОШЛОГО кадра
        this.player.update(dt);

        // 2. Сбрасываем флаг — сейчас проверим заново
        this.player.onGround = false;

        // 3. Земля
        if (this.player.y + this.player.h >= CONFIG.GROUND_Y) {
          this.player.y = CONFIG.GROUND_Y - this.player.h;
          if (this.player.vy > 0) this.player.vy = 0;
          this.player.onGround = true;
        }

        // 4. Коллизии
        for (const obj of LEVEL.objects) {
          const res = checkCollision(this.player, obj);
          if (res === 'die') { this.kill(); break; }
          if (res === 'win') {
            this.state = 'won';
            this.player.won = true;
            this.totalTime = this.time - this.startTime;
            this.sound.win();
            this.spawnParticles(
              this.player.x + this.player.w / 2,
              this.player.y + this.player.h / 2,
              60, '#ffe066', 400
            );
            break;
          }
        }

        // 5. Автопрыжок при удержании
        if (this.state === 'playing') {
          if (this.jumpHeld && this.player.onGround) {
            if (this.player.jump()) this.sound.jump();
          } else if (this.player.jumpBuffer > 0 && this.player.onGround) {
            if (this.player.jump()) this.sound.jump();
          }
        }

        // 6. Искры при приземлении
        if (!wasOnGround && this.player.onGround) {
          this.spawnParticles(
            this.player.x + this.player.w / 2,
            this.player.y + this.player.h,
            6, '#66e0ff', 120
          );
          this.sound.land();
        }

        // 7. Падение за карту
        if (this.player.y > CONFIG.GROUND_Y + 400) this.kill();

        this.camera.update(this.player);
      } else if (this.state === 'dead') {
      this.deathTimer += dt;
    }

    // Частицы
    for (let i = this.particles.length - 1; i >= 0; i--) {
      this.particles[i].update(dt);
      if (this.particles[i].life <= 0) this.particles.splice(i, 1);
    }
  }

  kill() {
    if (this.state !== 'playing') return;
    this.state = 'dead';
    this.player.alive = false;
    this.deathTimer = 0;
    this.sound.death();
    this.sound.musicCut();
    this.spawnParticles(
      this.player.x + this.player.w / 2,
      this.player.y + this.player.h / 2,
      45, '#ff4d6d', 500
    );
    this.spawnParticles(
      this.player.x + this.player.w / 2,
      this.player.y + this.player.h / 2,
      20, '#ffe066', 300
    );
  }

  /* ---------- ОТРИСОВКА ---------- */

  drawBackground() {
    const ctx = this.ctx;
    const progress = Math.min(1, this.player.x / LEVEL.length);

    const hue1 = 220 + progress * 120;
    const hue2 = 280 + progress * 80;
    const grad = ctx.createLinearGradient(0, 0, 0, CONFIG.H);
    grad.addColorStop(0, `hsl(${hue1}, 60%, 12%)`);
    grad.addColorStop(1, `hsl(${hue2}, 70%, 22%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);

    // Параллакс-сетка
    ctx.save();
    ctx.globalAlpha = 0.08;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1;
    const gridSize = 80;
    const offX = -(this.bgOffset * 0.2) % gridSize;
    for (let x = offX; x < CONFIG.W; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, CONFIG.H);
      ctx.stroke();
    }
    for (let y = 0; y < CONFIG.H; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(CONFIG.W, y);
      ctx.stroke();
    }
    ctx.restore();

    // «Горы»
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#ffffff';
    const hillOff = -(this.bgOffset * 0.4) % 400;
    for (let i = -1; i < 6; i++) {
      const bx = hillOff + i * 400;
      ctx.beginPath();
      ctx.moveTo(bx, CONFIG.H);
      ctx.lineTo(bx + 200, CONFIG.H - 280);
      ctx.lineTo(bx + 400, CONFIG.H);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  drawGround() {
    const ctx = this.ctx;
    ctx.save();

    ctx.fillStyle = '#0a0a18';
    ctx.fillRect(this.camera.x - 100, CONFIG.GROUND_Y, CONFIG.W + 200, CONFIG.H);

    ctx.shadowColor = '#00e0ff';
    ctx.shadowBlur = 25;
    ctx.strokeStyle = '#00e0ff';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(this.camera.x - 100, CONFIG.GROUND_Y);
    ctx.lineTo(this.camera.x + CONFIG.W + 100, CONFIG.GROUND_Y);
    ctx.stroke();
    ctx.shadowBlur = 0;

    ctx.globalAlpha = 0.3;
    ctx.strokeStyle = '#00e0ff';
    ctx.lineWidth = 2;
    const start = Math.floor(this.camera.x / 80) * 80;
    for (let x = start; x < this.camera.x + CONFIG.W + 80; x += 80) {
      ctx.beginPath();
      ctx.moveTo(x, CONFIG.GROUND_Y);
      ctx.lineTo(x, CONFIG.GROUND_Y + 20);
      ctx.stroke();
    }
    ctx.restore();
  }

  drawObjects() {
    for (const obj of LEVEL.objects) {
      if (obj.x + obj.w < this.camera.x - 50) continue;
      if (obj.x > this.camera.x + CONFIG.W + 50) continue;

      if (obj.type === 'spike') this.drawSpike(obj);
      else if (obj.type === 'block') this.drawBlock(obj);
      else if (obj.type === 'platform') this.drawPlatform(obj);
      else if (obj.type === 'finish') this.drawFinish(obj);
    }
  }

  drawSpike(obj) {
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = '#ff4d6d';
    ctx.shadowBlur = 18;
    ctx.fillStyle = '#ff4d6d';
    ctx.beginPath();
    if (obj.flip) {
      ctx.moveTo(obj.x, obj.y);
      ctx.lineTo(obj.x + obj.w, obj.y);
      ctx.lineTo(obj.x + obj.w / 2, obj.y + obj.h);
    } else {
      ctx.moveTo(obj.x, obj.y + obj.h);
      ctx.lineTo(obj.x + obj.w / 2, obj.y);
      ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
    }
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
  }

  drawBlock(obj) {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = 'rgba(0, 200, 255, 0.15)';
    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);

    ctx.shadowColor = '#00e0ff';
    ctx.shadowBlur = 15;
    ctx.strokeStyle = '#00e0ff';
    ctx.lineWidth = 3;
    ctx.strokeRect(obj.x + 1.5, obj.y + 1.5, obj.w - 3, obj.h - 3);
    ctx.restore();
  }

  drawPlatform(obj) {
    const ctx = this.ctx;
    ctx.save();
    ctx.shadowColor = '#a060ff';
    ctx.shadowBlur = 15;
    ctx.fillStyle = '#a060ff';
    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
    ctx.restore();
  }

  drawFinish(obj) {
    const ctx = this.ctx;
    ctx.save();
    const t = this.time * 3;
    const pulse = 0.7 + Math.sin(t) * 0.3;

    const grad = ctx.createLinearGradient(obj.x, obj.y, obj.x, obj.y + obj.h);
    grad.addColorStop(0, `rgba(255, 224, 102, ${0.9 * pulse})`);
    grad.addColorStop(1, `rgba(255, 100, 200, ${0.9 * pulse})`);
    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 30;
    ctx.fillStyle = grad;
    ctx.fillRect(obj.x, obj.y, obj.w, obj.h);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('FINISH', obj.x + obj.w / 2, obj.y - 20);
    ctx.restore();
  }

  drawPlayer() {
    if (this.state === 'dead') return;
    const ctx = this.ctx;
    const p = this.player;

    ctx.save();
    ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
    ctx.rotate(p.rotation);

    ctx.shadowColor = '#ffe066';
    ctx.shadowBlur = 25;

    const grad = ctx.createLinearGradient(-p.w/2, -p.h/2, p.w/2, p.h/2);
    grad.addColorStop(0, '#ffe066');
    grad.addColorStop(1, '#ff9066');
    ctx.fillStyle = grad;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);

    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(-p.w/2, -p.h/2, p.w, p.h);

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(-8, -8, 5, 5);
    ctx.fillRect(3, -8, 5, 5);

    ctx.restore();
  }

  drawHUD() {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = 'bold 22px Arial';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 6;
    ctx.textAlign = 'left';
    ctx.fillText(`Попытка: ${this.attempts}`, 24, 40);

    const progress = Math.min(100, Math.floor((this.player.x / LEVEL.length) * 100));
    ctx.textAlign = 'right';
    ctx.fillText(`${progress}%`, CONFIG.W - 24, 40);

    const barW = 400;
    const barX = CONFIG.W / 2 - barW / 2;
    const barY = 24;
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(barX, barY, barW, 10);
    ctx.fillStyle = '#00e0ff';
    ctx.shadowColor = '#00e0ff';
    ctx.shadowBlur = 10;
    ctx.fillRect(barX, barY, barW * (progress / 100), 10);

    this.drawVolumeIcon();

    ctx.restore();
  }

  // Иконка звука (клик/тап — вкл/выкл)
  drawVolumeIcon() {
    const ctx = this.ctx;
    const x = CONFIG.W - 40, y = 84;
    ctx.save();
    ctx.fillStyle = this.sound.muted ? 'rgba(255,255,255,0.35)' : '#fff';
    ctx.shadowBlur = 0;

    // Корпус динамика
    ctx.beginPath();
    ctx.moveTo(x - 16, y - 6);
    ctx.lineTo(x - 8, y - 6);
    ctx.lineTo(x - 2, y - 12);
    ctx.lineTo(x - 2, y + 12);
    ctx.lineTo(x - 8, y + 6);
    ctx.lineTo(x - 16, y + 6);
    ctx.closePath();
    ctx.fill();

    if (this.sound.muted) {
      // Крест — звук выключен
      ctx.strokeStyle = 'rgba(255,255,255,0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(x + 5, y - 10);
      ctx.lineTo(x + 15, y + 10);
      ctx.moveTo(x + 15, y - 10);
      ctx.lineTo(x + 5, y + 10);
      ctx.stroke();
    } else {
      // Волны звука
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      for (let i = 1; i <= 2; i++) {
        ctx.beginPath();
        ctx.arc(x - 2, y, 10 + i * 6, -Math.PI / 3.2, Math.PI / 3.2);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  drawOverlay() {
    const ctx = this.ctx;

    if (this.state === 'dead' && this.deathTimer > 0.3) {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
      ctx.textAlign = 'center';

      ctx.fillStyle = '#ff4d6d';
      ctx.shadowColor = '#ff4d6d';
      ctx.shadowBlur = 30;
      ctx.font = 'bold 80px Arial';
      ctx.fillText('GAME OVER', CONFIG.W / 2, CONFIG.H / 2 - 40);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 28px Arial';
      ctx.fillText(`Попыток: ${this.attempts}`, CONFIG.W / 2, CONFIG.H / 2 + 30);

      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '22px Arial';
      ctx.fillText('Нажми ПРОБЕЛ / клик — попробовать снова', CONFIG.W / 2, CONFIG.H / 2 + 90);
      ctx.restore();
    }

    if (this.state === 'won') {
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, 0, CONFIG.W, CONFIG.H);
      ctx.textAlign = 'center';

      ctx.fillStyle = '#ffe066';
      ctx.shadowColor = '#ffe066';
      ctx.shadowBlur = 40;
      ctx.font = 'bold 90px Arial';
      ctx.fillText('LEVEL COMPLETE!', CONFIG.W / 2, CONFIG.H / 2 - 60);

      ctx.shadowBlur = 0;
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 32px Arial';
      ctx.fillText(`Время: ${this.totalTime.toFixed(2)} сек`, CONFIG.W / 2, CONFIG.H / 2 + 20);
      ctx.fillText(`Попыток: ${this.attempts}`, CONFIG.W / 2, CONFIG.H / 2 + 65);

      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = '22px Arial';
      ctx.fillText('Нажми ПРОБЕЛ / клик — играть заново', CONFIG.W / 2, CONFIG.H / 2 + 130);
      ctx.restore();
    }
  }

  draw() {
    const ctx = this.ctx;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, CONFIG.W, CONFIG.H);

    this.drawBackground();

    ctx.save();
    this.camera.apply(ctx);

    this.drawGround();
    this.drawObjects();
    this.drawPlayer();

    for (const p of this.particles) p.draw(ctx);

    ctx.restore();

    this.drawHUD();
    this.drawOverlay();
  }

  loop(now) {
    const dt = Math.min(0.033, (now - this.lastTime) / 1000);
    this.lastTime = now;

    this.update(dt);
    this.draw();

    requestAnimationFrame((t) => this.loop(t));
  }
}

/* =========================================================
   СТАРТ
   ========================================================= */
const canvas = document.getElementById('game');
const game = new Game(canvas);
game.camera.x = -CONFIG.W * CONFIG.CAMERA_X_RATIO;
</script>
