<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Geometry Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0b1a;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none; /* iOS: без лупы/выделения при длинном таче */
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    background: #111;
    box-shadow: 0 0 60px rgba(0, 200, 255, 0.25);
    cursor: pointer;
    touch-action: none; /* убираем жесты браузера на таче — управляем сами */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none; /* без контекстного меню/выделения при длинном таче */
  }
  #stage { position: relative; }
  /* Меню победы (HTML-кнопки поверх канваса; после смерти — рестарт тапом) */
  #menu {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    gap: 14px;
    padding-bottom: 56px;
  }
  #menu.show { display: flex; }
  #menu .menu-btn {
    width: 300px;
    padding: 14px 0;
    font-family: inherit;
    font-size: 22px;
    font-weight: bold;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 2px solid rgba(0, 200, 255, 0.8);
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s, transform 0.1s;
  }
  #menu .menu-btn:hover {
    background: rgba(0, 200, 255, 0.25);
    box-shadow: 0 0 22px rgba(0, 200, 255, 0.55);
  }
  #menu .menu-btn:active { transform: scale(0.98); }
  /* «Выбор уровня» — ниже и шире остальных */
  #menu .menu-btn--select {
    width: 380px;
    background: rgba(0, 0, 0, 0.65);
    border-color: rgba(255, 224, 102, 0.9);
  }
  #menu .menu-btn--select:hover {
    background: rgba(255, 224, 102, 0.2);
    box-shadow: 0 0 22px rgba(255, 224, 102, 0.5);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="menu">
      <button class="menu-btn" id="btn-next">Следующий</button>
      <button class="menu-btn menu-btn--select" id="btn-select">Выбор уровня</button>
    </div>
  </div>
</div>

<!--
  Архитектура (мульти-уровневая):
    level-1.js ... level-20.js — данные уровней, регистрируются в window.GM_LEVELS
    game.js                    — общий движок (выбирает уровень по ?level=N)

  Запуск:
    gm-1.html            — уровень 1
    gm-1.html?level=1    — уровень 1
    gm-1.html?level=4    — уровень 4 («Аврора»)
    gm-1.html?level=20   — уровень 20 («Радуга», самый длинный)

  Новый уровень: добавь <script src="level-N.js"> перед game.js —
  движок сам выберет его по ?level=N.
-->
<script src="level-1.js"></script>
<script src="level-2.js"></script>
<script src="level-3.js"></script>
<script src="level-4.js"></script>
<script src="level-5.js"></script>
<script src="level-6.js"></script>
<script src="level-7.js"></script>
<script src="level-8.js"></script>
<script src="level-9.js"></script>
<script src="level-10.js"></script>
<script src="level-11.js"></script>
<script src="level-12.js"></script>
<script src="level-13.js"></script>
<script src="level-14.js"></script>
<script src="level-15.js"></script>
<script src="level-16.js"></script>
<script src="level-17.js"></script>
<script src="level-18.js"></script>
<script src="level-19.js"></script>
<script src="level-20.js"></script>
<script src="game.js"></script>
</body>
</html>
