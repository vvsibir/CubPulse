<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Geometry Dash</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #0b0b1a;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none; /* iOS: без лупы/выделения при длинном таче */
    -webkit-tap-highlight-color: transparent;
  }
  #wrap {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
  }
  #game {
    display: block;
    background: #111;
    box-shadow: 0 0 60px rgba(0, 200, 255, 0.25);
    cursor: pointer;
    touch-action: none; /* убираем жесты браузера на таче — управляем сами */
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none; /* без контекстного меню/выделения при длинном таче */
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game" width="1280" height="720"></canvas>
</div>

<!--
  Архитектура (мульти-уровневая):
    level-1.js, level-2.js, level-3.js ...  — данные уровней, регистрируются в window.GM_LEVELS
    game.js                                  — общий движок (выбирает уровень по ?level=N)

  Запуск:
    gm-1.html            — уровень 1
    gm-1.html?level=1    — уровень 1
    gm-1.html?level=2    — уровень 2
    gm-1.html?level=3    — уровень 3 (самый длинный)
-->
<script src="level-1.js"></script>
<script src="level-2.js"></script>
<script src="level-3.js"></script>
<script src="game.js"></script>
</body>
</html>
